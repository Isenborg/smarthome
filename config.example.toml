# Copy to config.toml (which is git-ignored) and fill in.
# Calendar links are secret: anyone with the link can read the calendar.

[location]
name = "Linköping"
latitude = 58.4108
longitude = 15.6214
timezone = "Europe/Stockholm"

[display]
days_ahead = 7

[server]
host = "127.0.0.1"
port = 8000

# One block per calendar. `person` is the label shown on the screen.
#
# iCloud:  Calendar app > right-click calendar > Share Calendar > Public Calendar > copy link
# Google:  calendar.google.com > Settings > (calendar) > "Secret address in iCal format"
# Outlook: outlook.office.com > Settings > Calendar > Shared calendars > Publish a calendar > ICS link

